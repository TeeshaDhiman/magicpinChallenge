# Render blueprint. Use a paid instance type: the free tier sleeps after
# 15 idle minutes, and the cold start would fail the judge's healthz polls.
services:
  - type: web
    name: vera-bot
    runtime: docker
    plan: starter
    healthCheckPath: /v1/healthz
    envVars:
      - key: TEAM_NAME
        sync: false
      - key: TEAM_MEMBERS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SUBMITTED_AT
        sync: false
